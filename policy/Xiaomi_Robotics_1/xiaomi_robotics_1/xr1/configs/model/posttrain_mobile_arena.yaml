# @package _global_
model:
  type: "BaseRunner"
  params:
    pretrained: ???
    model:
      type: "xr1"
      freq_coefficient: 1.0
      # Official XR1 post-training excludes the three base-velocity bins from
      # the frequency loss; the MobileArena adapter places [vx, vy, wz] at 17:20.
      freq_excluded_dims: [17, 18, 19]
      ffn_gradient_checkpointing: true
      async_train: true
