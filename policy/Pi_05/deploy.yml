# Basic experiment configuration
policy_name: Pi_05
protocol: ws
host: localhost
bench_name: MobileArena
task_name: null
env_cfg_type: mobile_arena
seed: null
eval_batch: true

# Must point to a checkpoint retrained with the active 45D layout.
# The previous MobileArena-pi05_mobile_arena_full checkpoints are 75D and are not compatible.
checkpoint_num: 59999
result_dir: "./results/pi05/"
obs_transform_pipeline: "xspark-v1.0"

# Model / action configuration
action_type: joint
policy_uv_env_path: openpi
# Must match the config used by train.sh (default OPENPI_TRAIN_CONFIG_NAME).
train_config_name: pi05_mobile_arena_full
repo_id: mobile_arena_data
mobile_arena: true

port: 6000
